name: designlens
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  pdf: ^3.13.1
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/arabic/Cairo-Regular.ttf
    - family: Tajawal
      fonts:
        - asset: assets/fonts/arabic/Tajawal-Regular.ttf
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/arabic/IBMPlexSansArabic-Regular.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/arabic/Amiri-Regular.ttf
    - family: Reem Kufi
      fonts:
        - asset: assets/fonts/arabic/ReemKufi-Regular.ttf
    - family: Aref Ruqaa
      fonts:
        - asset: assets/fonts/arabic/ArefRuqaa-Regular.ttf
    - family: Changa
      fonts:
        - asset: assets/fonts/arabic/Changa-Regular.ttf
    - family: Noto Naskh Arabic
      fonts:
        - asset: assets/fonts/arabic/NotoNaskhArabic-Regular.ttf

  assets:
    - assets/images/ui_styles/
    - assets/fonts/NotoNaskhArabic-Regular.ttf
