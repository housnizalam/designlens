name: designlens
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  file_picker: ^13.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  pdf: ^3.13.1
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/arabic/Cairo-Regular.ttf
    - family: Tajawal
      fonts:
        - asset: assets/fonts/arabic/Tajawal-Regular.ttf
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/arabic/IBMPlexSansArabic-Regular.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/arabic/Amiri-Regular.ttf
    - family: Reem Kufi
      fonts:
        - asset: assets/fonts/arabic/ReemKufi-Regular.ttf
    - family: Aref Ruqaa
      fonts:
        - asset: assets/fonts/arabic/ArefRuqaa-Regular.ttf
    - family: Changa
      fonts:
        - asset: assets/fonts/arabic/Changa-Regular.ttf
    - family: Noto Naskh Arabic
      fonts:
        - asset: assets/fonts/arabic/NotoNaskhArabic-Regular.ttf

  assets:
    - assets/images/ui_styles/
    - assets/images/home/
    - assets/images/branding/
    - assets/images/backgrounds/
    - assets/fonts/NotoNaskhArabic-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/branding/designlens_app_icon.png"

  windows:
    generate: true
    image_path: "assets/images/branding/designlens_app_icon.png"
    icon_size: 256